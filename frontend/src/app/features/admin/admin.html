<div class="header-panel">
  <div class="stats-row">
    <mat-card class="stat-card" *ngFor="let stat of stats()">
      <div class="icon-tile" [style.background]="stat.iconGradient">
        <mat-icon>{{ stat.icon }}</mat-icon>
      </div>
      <div class="stat-text">
        <span class="stat-label">{{ stat.label }}</span>
        <span class="stat-value">{{ stat.value }}</span>
        <span class="stat-sublabel">{{ stat.sublabel }}</span>
      </div>
    </mat-card>
  </div>
</div>

<div class="tab-pill-bar">
  <button
    *ngFor="let tab of tabs"
    mat-button
    class="tab-pill"
    [class.active]="tab.active"
    (click)="selectTab(tab)">
    {{ tab.label }}
  </button>
</div>

<section class="tab-content" [ngSwitch]="activeTab">

  <div *ngSwitchCase="'recent'" class="content-panel">
    <app-admin-recent-enrollments></app-admin-recent-enrollments>
  </div>

  <div *ngSwitchCase="'teachers'" class="content-panel">
    <app-admin-teachers (shareTeacherCount)="teacherCount($event)"></app-admin-teachers>
  </div>

  <div *ngSwitchCase="'students'" class="content-panel">
    <app-admin-allstudents (shareTotalCOunt)="totalStudentCount($event)"></app-admin-allstudents>
  </div>

</section>
